<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The project's one ornament at tab size: the black rectangle is what the
    measurement counts. Dark mode is the same mark inverted, with the site's
    own tokens, and never an icon of its own.
  -->
  <style>
    .paper { fill: #f6f4ef }
    .bar { fill: #14130f }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #14130f }
      .bar { fill: #ece8de }
    }
  </style>
  <rect class="paper" width="32" height="32" />
  <rect class="bar" x="5" y="12" width="22" height="8" />
</svg>
