name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Formatting
        run: ruff format --check .

  test:
    name: Tests on ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run test suite
        run: pytest
      # The suite carries three guards beyond ordinary unit tests: the
      # generated schema module must match its design document, the figures
      # quoted in the documentation must hold against the data files, and no
      # personal data may enter the repository.

  web:
    name: Website builds
    runs-on: ubuntu-latest
    # The site is a static export whose pages read committed data at build
    # time; a broken export or a content file that no longer matches its
    # type would otherwise surface only at deploy.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Lint
        run: npm run lint
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web

  sources:
    name: Upstream sources still reachable
    runs-on: ubuntu-latest
    # The pipeline depends on two public endpoints. A silent change upstream
    # would otherwise surface only on the next harvest.
    steps:
      - uses: actions/checkout@v7
      - name: DG SANTE search form
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -L \
            https://ec.europa.eu/food/audits-analysis/audit-report)
          echo "search form: $code"
          test "$code" = "200"
      - name: Jordbruksverket permit listing
        run: |
          url=https://jordbruksverket.se/kontroller-och-tillsyn/miljo/stora-anlaggningar-for-uppfodning-av-fjaderfa-och-gris/tillstand-och-domar-for-stora-gris--och-fjaderfaanlaggningar
          code=$(curl -sS -o /dev/null -w '%{http_code}' -L "$url")
          echo "permit listing: $code"
          test "$code" = "200"
